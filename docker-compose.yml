services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: catalog_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db

  web:
    image: nginx:latest
    container_name: catalog_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html
    depends_on:
      - app

  db:
    image: postgres:15
    container_name: catalog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-catalog_db}
      POSTGRES_USER: ${DB_USERNAME:-catalog_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-catalog_user} -d ${DB_DATABASE:-catalog_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  node:
    image: node:20
    container_name: catalog_node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
